<div class="sig-dialog">
  <h2 mat-dialog-title class="dialog-title">
    <mat-icon>{{ isEdit ? 'edit' : 'add_chart' }}</mat-icon>
    {{ isEdit ? 'Edit signal' : 'New signal' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="save()">
    <div mat-dialog-content class="dialog-content">

      <!-- Category -->
      <div class="field-block">
        <label class="field-block-label">Category</label>
        <mat-radio-group formControlName="category" class="category-group">
          <mat-radio-button
            *ngFor="let c of categories"
            [value]="c"
            class="category-option"
          >
            {{ c | titlecase }}
          </mat-radio-button>
        </mat-radio-group>
        <mat-error *ngIf="form.get('category')?.invalid && form.get('category')?.touched" class="category-error">
          Category is required
        </mat-error>
      </div>

      <!-- Pair -->
      <mat-form-field appearance="outline" class="full-field">
        <mat-label>Pair</mat-label>
        <input matInput formControlName="pair" maxlength="50" placeholder="BTC/USDT" />
        <mat-error *ngIf="form.get('pair')?.hasError('required')">Pair is required</mat-error>
      </mat-form-field>

      <!-- Entry -->
      <mat-form-field appearance="outline" class="full-field">
        <mat-label>Entry</mat-label>
        <input matInput type="number" formControlName="entryPrice" placeholder="Entry price" />
        <mat-error *ngIf="form.get('entryPrice')?.hasError('required')">Entry is required</mat-error>
      </mat-form-field>

      <!-- Take Profit -->
      <div class="field-block">
        <label class="field-block-label">Take Profit <span class="field-block-optional">(optional)</span></label>
        <div class="field-row three">
          <mat-form-field appearance="outline" class="third-field">
            <mat-label>TP 1</mat-label>
            <input matInput type="number" formControlName="takeProfit1" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="third-field">
            <mat-label>TP 2</mat-label>
            <input matInput type="number" formControlName="takeProfit2" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="third-field">
            <mat-label>TP 3</mat-label>
            <input matInput type="number" formControlName="takeProfit3" />
          </mat-form-field>
        </div>
      </div>

      <!-- Stop Loss -->
      <mat-form-field appearance="outline" class="full-field">
        <mat-label>Stop Loss</mat-label>
        <input matInput type="number" formControlName="stopLoss" />
      </mat-form-field>

      <!-- Analysis -->
      <mat-form-field appearance="outline" class="full-field">
        <mat-label>Analysis</mat-label>
        <textarea matInput formControlName="analysis" rows="4" maxlength="1000"></textarea>
        <mat-hint align="end">{{ form.get('analysis')?.value?.length || 0 }}/1000</mat-hint>
      </mat-form-field>

    </div>

    <div mat-dialog-actions class="dialog-actions">
      <button mat-stroked-button type="button" class="btn-ghost" (click)="close()" [disabled]="saving">Cancel</button>
      <button mat-flat-button color="primary" class="btn-primary" type="submit" [disabled]="saving || form.invalid">
        <span *ngIf="!saving">{{ isEdit ? 'Save changes' : 'Create signal' }}</span>
        <span *ngIf="saving" class="btn-loading">
          <span class="btn-spinner"></span> Saving…
        </span>
      </button>
    </div>
  </form>
</div>
