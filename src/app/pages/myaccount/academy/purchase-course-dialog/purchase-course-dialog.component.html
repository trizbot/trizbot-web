<h2 mat-dialog-title class="dialog-title">
  Confirm Enrollment
  <button mat-icon-button class="close-btn" type="button" [disabled]="loading" (click)="close()">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content [formGroup]="form">

  <div class="course-summary">
    <div class="summary-title">{{ course.title }}</div>
    <div class="summary-instructor">by &#64;{{ course.instructor.username }}</div>
  </div>

  <div class="summary-row highlight">
    <span class="label">Total to pay</span>
    <span class="value">
      <ng-container *ngIf="!isFree">&#36;{{ course.price | number: '1.2-2' }}</ng-container>
      <ng-container *ngIf="isFree">Free</ng-container>
    </span>
  </div>

  <ng-container *ngIf="!isFree">
    <mat-label class="f-w-600 m-b-8 d-block m-t-3">Transaction PIN</mat-label>
    <mat-form-field appearance="outline" class="w-100">
      <input
        matInput
        type="password"
        inputmode="numeric"
        autocomplete="off"
        maxlength="6"
        formControlName="transactionPin"
      />
      <mat-error *ngIf="form.controls.transactionPin.hasError('required')">
        Transaction PIN is required.
      </mat-error>
      <mat-error *ngIf="form.controls.transactionPin.hasError('pattern')">
        Enter a 4–6 digit numeric PIN.
      </mat-error>
    </mat-form-field>
  </ng-container>

  <mat-label class="f-w-600 m-b-8 d-block">Reference</mat-label>
  <mat-form-field appearance="outline" class="w-100">
    <input matInput formControlName="reference" readonly />
  </mat-form-field>

  <div *ngIf="errorMessage" class="alert alert-danger m-t-2">
    <b>{{ errorMessage }}</b>
  </div>

  <button
    mat-flat-button
    color="primary"
    class="fw-bold w-100 submit-btn"
    type="button"
    [disabled]="loading || form.invalid"
    (click)="submit()"
  >
    {{ loading ? 'Processing...' : (isFree ? 'Confirm Free Enrollment' : 'Confirm Payment') }}
  </button>
</mat-dialog-content>
